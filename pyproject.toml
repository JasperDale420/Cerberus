[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "cerberus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.43.2",
    "unusualwhales-python-client>=5.0.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.0",
    "pyarrow>=21.0.0",
    "pandas>=2.3,<4",
    "pandas-ta>=0.4.71b0",
    "numpy>=2.2,<2.5",
    "python-dotenv>=0.21.0",
    "sqlalchemy>=2.0",
    "PyYAML>=6.0",
    "APScheduler>=3.11",
    "httpx>=0.27,<0.29",
    "pytz>=2025.2",
    "statsmodels>=0.14",
    "structlog>=24.1.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.14",
    "mypy>=1.19",
    "bandit>=1.9",
    "detect-secrets>=1.5",
    "pre-commit>=3.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    "types-pytz>=2025.2",
]

[tool.ruff]
extend = "ruff-base.toml"
# Exclude a variety of commonly ignored directories.

line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]
# Some modules are heavily dynamic or depend on third-party stubs that are not
# compatible with mypy out of the box; exclude them from the CI type-check until
# they are annotated or proper stubs are added.
exclude = "(^src/data/alpaca\\.py$|^src/data/pipeline\\.py$)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Fast, isolated unit tests (no I/O, no network)",
    "integration: Tests with real DB, file I/O, or component interactions",
    "contract: Boundary tests for external APIs/protocols",
    "e2e: End-to-end full system flow tests",
    "slow: Tests that take >1s (opt-in, excluded by default)",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "scripts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
