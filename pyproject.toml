[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerberus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.43.2",
    "unusualwhales-python-client>=5.0.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.0",
    "pandas>=2.3",
    "pandas-ta>=0.4.71b0",
    "numpy>=2.2",
    "python-dotenv>=0.21.0",
    "sqlalchemy>=2.0",
    "PyYAML>=6.0",
    "APScheduler>=3.11",
    "httpx>=0.27",
    "pytz>=2025.2",
    "statsmodels>=0.14",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.14",
    "mypy>=1.19",
    "bandit>=1.9",
    "detect-secrets>=1.5",
    "pre-commit>=3.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    "types-pytz>=2025.2",
]

[tool.ruff]
extend = "../ruff-base.toml"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
files = ["src"]
# Some modules are heavily dynamic or depend on third-party stubs that are not
# compatible with mypy out of the box; exclude them from the CI type-check until
# they are annotated or proper stubs are added.
exclude = "(^src/data/alpaca\\.py$|^src/data/pipeline\\.py$)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
addopts = "--verbose --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, isolated tests",
    "integration: tests across modules and real DB/filesystem",
    "contract: boundary tests for external APIs/protocols",
    "e2e: end-to-end smoke flows (offline/fake dependencies)",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
