[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "cerberus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "empire-core",
    "empire-schemas",
    "empire-gateway-client",
    "alpaca-py>=0.43.2",
    "unusualwhales-python-client>=5.0.1",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.1",
    "pyarrow>=21.0.0",
    "pandas>=3.0.2,<4",
    "pandas-ta>=0.4.71b0",
    "numpy>=2.4.4,<2.5",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "PyYAML>=6.0",
    "APScheduler>=3.11",
    "httpx>=0.28.1,<0.29",
    "pytz>=2026.1.post1",
    "arch>=8.0.0",
    "filterpy>=1.4.5",
    "statsmodels>=0.14",
    "structlog>=25.5.0",
    "optuna>=4.8.0",
    "pomegranate>=1.1.2",
    "tenacity>=9.1.4",
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.15.10",
    "mypy>=1.20.1",
    "bandit>=1.9.4",
    "detect-secrets>=1.5",
    "pre-commit>=4.5.1",
    "types-PyYAML>=6.0.12.20260408",
    "types-requests>=2.33.0.20260408",
    "types-pytz>=2026.1.1.20260408",
]

[tool.ruff]
extend = "ruff-base.toml"
# Exclude vendored third-party packages and research notebooks from linting.
exclude = [
    "unusualwhales_python_client-5.0.1",
    "autoresearch",
]

line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]
# Some modules are heavily dynamic or depend on third-party stubs that are not
# compatible with mypy out of the box; exclude them from the CI type-check until
# they are annotated or proper stubs are added.
exclude = "(^src/data/alpaca\\.py$|^src/data/pipeline\\.py$)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Fast, isolated unit tests (no I/O, no network)",
    "integration: Tests with real DB, file I/O, or component interactions",
    "contract: Boundary tests for external APIs/protocols",
    "e2e: End-to-end full system flow tests",
    "slow: Tests that take >1s (opt-in, excluded by default)",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "scripts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.uv.sources]
empire-core = { path = "../empire-core", editable = true }
empire-schemas = { path = "../empire-schemas", editable = true }
empire-gateway-client = { path = "../empire-gateway-client", editable = true }
