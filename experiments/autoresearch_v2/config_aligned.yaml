# Multi-Strategy Config with ALIGNED Regime Filtering
# Strategies now use MarketContextService regime_snapshot internally,
# matching the activation policy system. No classifier mismatch.

database_url: "sqlite:///cerberus.db"
timezone: "US/Eastern"
index_symbol: "SPY"
initial_cash: 100000.0
log_level: "WARNING"

regime:
  vol_symbol: "VXX"

hmm_regime:
  enabled: false

backtest:
  disable_flow_strategies: true
  bar_resolution_minutes: "daily"
  partial_fill_mode: "none"
  slippage_mode: "fixed"
  spread_mode: "fixed"

universe:
  symbols:
    - "SPY"
    - "QQQ"
    - "AAPL"
    - "MSFT"
    - "GOOGL"
    - "AMZN"
    - "META"
    - "NVDA"
    - "TSLA"
    - "AMD"
    - "AVGO"
    - "JPM"
    - "BAC"
    - "GS"
    - "XOM"
    - "CVX"

risk:
  risk_pct: 0.01
  daily_loss_pct: 0.025
  open_risk_pct: 0.05
  max_daily_loss: 4000.0
  max_risk_per_trade: 2000.0
  max_open_risk: 7000.0
  max_trades_per_day: 50
  max_open_positions: 8
  max_positions_per_strategy: 3
  max_notional_per_order: 50000.0
  max_notional_per_symbol: 50000.0
  commission_per_share: 0.005
  min_commission: 1.0
  slippage_bps: 5.0

strategies:
  # TREND-FOLLOWING — now skips SHOCK+HIGH vol internally (aligned with regime snapshot)
  daily_momentum:
    enabled: true
    ema_fast_period: 20
    ema_slow_period: 50
    pullback_pct: 0.02
    stop_atr_mult: 1.5
    target_atr_mult: 5.0
    min_bars: 55
    max_hold_days: 8
    long_only: true
    vol_avg_mult: 1.0
    confluence_threshold: 55.0

  # BREAKOUT — self-filters via ADX
  regime_adaptive_momentum:
    enabled: true
    breakout_only: true
    ema_fast_period: 20
    ema_slow_period: 50
    adx_period: 14
    adx_trend_threshold: 25.0
    adx_range_threshold: 20.0
    pullback_lookback: 10
    pullback_min_pct: 0.02
    high_vol_mult: 2.0
    trade_high_vol: false
    breakout_lookback: 10
    breakout_margin_pct: 0.005
    stop_atr_mult_breakout: 2.5
    target_atr_mult_breakout: 5.0
    min_bars: 55
    max_hold_days: 8
    long_only: true
    vol_avg_mult: 0.8
    cooldown_bars: 5

  # MEAN REVERSION — uses regime snapshot trend=FLAT filter (aligned)
  daily_mean_reversion:
    enabled: true
    bb_period: 20
    bb_std: 2.0
    adx_period: 14
    adx_range_threshold: 22.0
    rsi_period: 14
    rsi_oversold: 30.0
    rsi_overbought: 70.0
    stop_bb_mult: 1.5
    min_bars: 30
    max_hold_days: 5
    allow_short: false
    vol_avg_mult: 0.5
    cooldown_bars: 5
    use_regime_trend_filter: true

  # CRISIS ALPHA — internal ATR check + optional regime vol check
  daily_vol_fade:
    enabled: true
    ema_period: 20
    atr_period: 14
    deviation_mult: 2.0
    vol_expansion_mult: 1.5
    retracement_pct: 0.5
    stop_atr_below_low: 0.5
    min_bars: 25
    max_hold_days: 3
    min_price: 5.0
    cooldown_bars: 10
    require_high_vol_regime: false
