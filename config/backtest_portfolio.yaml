# Multi-Strategy Portfolio Backtest Config
# Enables 5 backtestable V2 strategies with HRP cross-strategy allocation.
# flow_alpha and pair_trading_v2 excluded (no historical data for backtests).
# Data: 27 symbols, 2020-01-01 → 2026-03-20, 1-min bars.

database_url: "sqlite:///backtest_portfolio.db"
timezone: "US/Eastern"
index_symbol: "SPY"
log_level: "INFO"
auto_eod_agent: false
initial_cash: 100000.0

# Multi-Axis Regime detection
regime:
  vol_symbol: "VXX"
  window: 60
  min_bars: 20
  vol_baseline_window: 120
  smooth_k: 5

# V2 Strategy Routing — regime-aware
strategy_routing:
  bull: [trend_rider_pro, mean_reversion_pro, orb_v2, rsi_bounce, momentum_fade]
  bear: [trend_rider_pro, mean_reversion_pro, orb_v2, rsi_bounce, momentum_fade]
  chop: [mean_reversion_pro, rsi_bounce, momentum_fade]

# V2 Strategies — 5 active for portfolio baseline
strategies:
  mean_reversion_pro:
    enabled: true
    hmm_gate:
      enabled: true
      reject_regimes: ["stress_up"]
      min_confidence: 0.6
    signal_timeframe: 5
    confluence_threshold: 45.0
    cooldown_bars: 6
    max_hold_minutes: 60
    higher_tf_alignment: false
    vwap_dist_threshold: 0.006
    bb_pos_threshold: 0.40
    vpin_threshold: 0.95
    stop_atr_mult: 2.0
    min_bars: 20
    activation:
      session: [opening, midday, power_hour]
      trend: [flat, up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5
  trend_rider_pro:
    enabled: true
    hmm_gate:
      enabled: true
      reject_regimes: ["trend_down"]
      min_confidence: 0.6
    signal_timeframe: 5
    confluence_threshold: 65.0
    cooldown_bars: 4
    min_trend_alignment: 0.30
    time_window_start: "09:40"
    time_window_end: "14:30"
    pullback_threshold: 0.008
    stop_atr_mult: 2.5
    target_atr_mult: 4.0
    trail_min_profit_r: 0.75
    max_hold_minutes: 120
    activation:
      session: [opening, midday]
      trend: [up, down]
      vol: [low, normal]
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.6
  flow_alpha:
    enabled: false       # No historical flow data for backtests
    signal_timeframe: 5
    confluence_threshold: 50.0
    cooldown_bars: 25
    max_hold_minutes: 45
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.4
  orb_v2:
    enabled: true
    hmm_gate:
      enabled: true
      reject_regimes: ["stress_up"]
      min_confidence: 0.6
    signal_timeframe: 1
    confluence_threshold: 60.0
    cooldown_bars: 10
    max_hold_minutes: 180
    vol_gate_mult: 1.53
    trail_min_profit_r: 0.96
    activation:
      session: [opening, midday]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good]
      risk: [risk_on, neutral]
      min_confidence: 0.5
  rsi_bounce:
    enabled: true
    hmm_gate:
      enabled: true
      reject_regimes: ["stress_up"]
      min_confidence: 0.6
    signal_timeframe: 5
    confluence_threshold: 55.0
    cooldown_bars: 20
    max_hold_minutes: 45
    rsi_oversold: 20.0
    rsi_overbought: 80.0
    band_tolerance: 1.5
    target_atr_mult: 2.0
    activation:
      session: [opening, midday, power_hour]
      trend: [flat, up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5
  momentum_fade:
    enabled: true
    hmm_gate:
      enabled: true
      reject_regimes: ["trend_up", "trend_down"]
      min_confidence: 0.6
    signal_timeframe: 5
    confluence_threshold: 75.0
    cooldown_bars: 4
    max_hold_minutes: 90
    vwap_threshold: 0.005
    volume_surge_mult: 1.5
    target_atr_mult: 3.0
    stop_atr_mult: 1.25
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down]
      vol: [normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5
  pair_trading_v2:
    enabled: false       # Needs cointegration pair data

  # V1 legacy strategies — explicitly disabled
  vwap_reversion:
    enabled: false
  orb:
    enabled: false
  vwap_trend_rider:
    enabled: false
  index_mean_reversion:
    enabled: false
  flow_momentum:
    enabled: false
  gap_fill:
    enabled: false
  vix_spike_fade:
    enabled: false
  momentum_continuation:
    enabled: false
  fusion_v1:
    enabled: false
  pair_trading:
    enabled: false
  trend_pullback:
    enabled: false
  failed_breakout:
    enabled: false
  order_flow_imbalance:
    enabled: false
  intraday_momentum:
    enabled: false

# Risk — sized for $100k account, expanded for 5 strategies
risk:
  max_daily_loss: 3000.0
  max_risk_per_trade: 3000.0
  max_open_risk: 10000.0
  max_trades_per_day: 80            # 5 strategies need headroom
  max_open_positions: 12            # 5 strategies × ~2-3 positions each
  max_positions_per_strategy: 3
  max_notional_per_order: 90000.0
  max_notional_per_symbol: 90000.0
  time_in_force: "day"
  risk_mode: "normal"
  slippage_bps: 3.0
  commission_per_share: 0.003
  min_commission: 0.50

  # HRP cross-strategy allocation
  hrp:
    enabled: true
    lookback_days: 60
    min_strategies: 3
    rebalance_interval: 5
    min_weight: 0.05
    max_weight: 0.40

  advanced_exits:
    enabled: true
    trailing_stop:
      enabled: true
      trail_pct: 0.02
      min_profit_to_activate: 0.005
    partial_exits:
      enabled: false
    regime_aware_stops: true

  alpha_rank_multipliers:
    1: 1.5
    2: 1.25
    3: 1.1
    5: 1.0
    10: 0.75

# Backtest Realism
backtest:
  disable_flow_strategies: true
  partial_fill_mode: "random"
  partial_fill_pct: 0.7
  slippage_mode: "fixed"
  slippage_impact_mult: 5.0
  spread_mode: "fixed"
  daily_equity_reset: false
  rth_only: true
  force_flat_at_1600: true

# Scanner
scanner:
  enabled: true
  interval_minutes: 5
  max_watchlist_size: 20
  top_k_per_strategy: 5
  min_price: 5.0
  max_price: 500.0
  min_volume: 500000

# Universe — 27 symbols (matches backtest_v2.yaml baseline)
universe:
  symbols:
    - SPY
    - QQQ
    - AAPL
    - NVDA
    - TSLA
    - AMD
    - AMZN
    - META
    - MSFT
    - GOOGL
    - AVGO
    - NFLX
    - JPM
    - BAC
    - GS
    - CRM
    - XOM
    - CVX
    - MU
    - INTC
    - QCOM
    - PLTR
    - COIN
    - HOOD
    - SOFI
    - UBER
    - VXX
