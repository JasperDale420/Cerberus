strategies:
  vwap_reversion:
    enabled: true
    band_sigma: 2.0
    # PRD name (kept in sync with band_sigma by ConfigLoader).
    sigma_band: 2.0
    confirmation: "rsi"
    rsi_len: 2
    rsi_oversold: 10
    rsi_overbought: 90
    risk_reward: 2.0
    time_window_start: "09:45"
    time_window_end: "15:45"
    max_hold_minutes: 60
    # PRD Addendum: Multi-axis regime activation
    activation:
      session: [opening, midday, power_hour]
      trend: [flat]
      vol: [normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.6

  orb:
    enabled: true
    orb_minutes: 15
    risk_reward: 2.0
    stop_loss_pct: 0.005 # 0.5% backup stop
    # PRD-listed optional filters
    min_gap_pct: 0.01
    min_flow_zscore: 0.0
    # PRD Addendum: Multi-axis regime activation
    activation:
      session: [opening]
      trend: [up, down]
      vol: [normal, high, shock]
      liquidity: [good]
      risk: [risk_on, neutral]
      min_confidence: 0.5

  index_mean_reversion:
    enabled: true
    symbols: ["SPY", "QQQ"]
    bb_len: 20
    bb_std: 2.0
    stop_pct: 0.005 # 0.5%
    # PRD Addendum: Multi-axis regime activation
    activation:
      session: [midday, power_hour]
      trend: [flat]
      vol: [normal, high]
      liquidity: [good]
      risk: [neutral, risk_off]
      min_confidence: 0.6

  flow_momentum:
    enabled: true
    min_flow_zscore: 2.5
    vol_mult: 1.5
    risk_reward: 2.0 # backup stop
    # PRD Addendum: Multi-axis regime activation
    activation:
      session: [opening, midday]
      trend: [up, down]
      vol: [normal, high, shock]
      liquidity: [good]
      risk: [risk_on, neutral]
      min_confidence: 0.5

  gap_fill:
    enabled: true
    min_gap: 0.015
    max_gap: 0.10
    risk_reward: 2.0
    or_time_minutes: 15
    # PRD: allow CHOP / weak trend (optional); used only if market_state.meta.trend_score is available
    weak_trend_max_score: 1.0
    # PRD Addendum: Multi-axis regime activation
    activation:
      session: [opening]
      trend: [up, down, flat]
      vol: [normal, high]
      liquidity: [good, thin]
      risk: [neutral]
      min_confidence: 0.4

  vwap_trend_rider:
    enabled: true
    ema_fast: 20
    ema_slow: 50
    vol_mult: 1.2
    risk_reward: 2.0
    min_trend_score: 1.5
    # PRD Addendum: Multi-axis regime activation
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down]
      vol: [low, normal]
      liquidity: [good]
      risk: [risk_on]
      min_confidence: 0.6

  # NEW: Fills shock volatility gap - fades VIX spikes
  vix_spike_fade:
    enabled: true
    symbols: ["SPY", "QQQ"]
    vix_spike_pct: 0.20  # 20% intraday VIX spike
    vix_absolute: 30.0   # Or absolute VIX > 30
    index_drop_pct: 0.015  # 1.5% down from open
    reversion_target: 0.50  # Target 50% of decline
    stop_buffer: 0.005  # 0.5% below day low
    activation:
      session: [midday, power_hour]
      trend: [down]
      vol: [high, shock]  # KEY: Only strategy for shock
      liquidity: [good]
      risk: [risk_off]
      min_confidence: 0.4

  # NEW: Fast breakouts without pullback wait
  momentum_continuation:
    enabled: true
    breakout_lookback: 5  # Days for high/low levels
    vol_mult: 2.0  # Volume > 2x average
    close_position: 0.75  # Close in top 25% of range
    risk_reward: 1.5
    ema_fast: 20
    ema_slow: 50
    max_trades_per_session: 2
    activation:
      session: [opening]
      trend: [up, down]
      vol: [normal, high, shock]
      liquidity: [good]
      risk: [risk_on]
      min_confidence: 0.6

  regime_trend_up:
    enabled: true
    min_bars: 30
    pullback_pct: 0.008
    rsi_max: 70.0
    rsi_min: 35.0
    stop_atr_mult: 1.5
    target_rr: 2.5
    time_window_start: "09:35"
    time_window_end: "15:45"
    cooldown_bars: 10
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral, risk_off]
      min_confidence: 0.0

  regime_bear:
    enabled: true
    rsi_short_entry: 55.0
    rsi_long_entry: 45.0
    rsi_flat_high: 65.0
    rsi_flat_low: 35.0
    stop_atr_mult: 1.5
    target_atr_mult: 2.5
    high_vol_target_mult: 1.5
    min_bars: 20
    cooldown_bars: 3
    hard_stop_time: "15:45"
    activation:
      session: [opening, midday, power_hour, close]
      trend: [up, down, flat]
      vol: [low, normal, high, shock]
      liquidity: [good, thin, stressed]
      risk: [risk_on, neutral, risk_off]
      min_confidence: 0.0

  regime_adaptive:
    enabled: true
    rsi_long_entry: 45.0
    rsi_short_entry: 60.0
    stop_atr_mult: 1.5
    target_atr_mult: 3.0
    min_bars: 20
    cooldown_bars: 5
    activation:
      session: [premarket, opening, midday, power_hour, close]
      trend: [up, down, flat]
      vol: [low, normal, high, shock]
      liquidity: [good, thin, stressed]
      risk: [risk_on, neutral, risk_off]
      min_confidence: 0.0

  autoresearch_strategy:
    enabled: true
    stop_atr_mult: 1.5
    target_atr_mult: 3.0
    min_bars: 30
    cooldown_bars: 5
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral, risk_off]
      min_confidence: 0.0

  daily_research_v9a:
    enabled: true
    min_bars: 55
    allow_overnight: true
    max_hold_days: 5
    cooldown_bars: 1
    ema_fast: 20
    ema_slow: 50
    pullback_pct: 0.03
    rsi_period: 2
    rsi_threshold: 20.0
    atr_period: 14
    stop_atr_mult: 1.5
    target_atr_mult: 3.0
    activation:
      session: [premarket, opening, midday, power_hour, close]
      trend: [up, down, flat]
      vol: [low, normal, high, shock]
      liquidity: [good, thin]
      risk: [risk_on, neutral, risk_off]
      min_confidence: 0.0
