    band_sigma: 2.0
    risk_reward: 2.0
    time_window_start: "09:45"
    time_window_end: "15:45"
    max_hold_minutes: 60

  orb:
    enabled: true
    orb_minutes: 15
    risk_reward: 2.0
    stop_loss_pct: 0.005 # 0.5% backup stop

  index_mean_reversion:
    enabled: true
    bb_len: 20
    bb_std: 2.0
