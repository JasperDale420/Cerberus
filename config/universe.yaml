universe:
  # Explicit symbols (always included)
  symbols:
    - SPY
    - QQQ
    - NVDA
    - TSLA
    - AMD

  # Optional static symbol files (one symbol per line; CSV allowed, first column used)
  static_files: []

  # Optional dynamic universe sources
  dynamic:
