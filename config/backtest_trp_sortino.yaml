# Autoresearch: Trend Rider Pro Sortino+PnL Optimization
# TRP-isolated backtest — fast iteration config
# 15 liquid symbols, 2024-2025 data for ~2-5 min per run
# Final validation against full universe + full date range

database_url: "sqlite:///backtest_trp_sortino.db"
timezone: "US/Eastern"
index_symbol: "SPY"
log_level: "WARNING"
auto_eod_agent: false
initial_cash: 100000.0

# Multi-Axis Regime detection
regime:
  vol_symbol: "VXX"
  window: 60
  min_bars: 20
  vol_baseline_window: 120
  smooth_k: 5

# Route TRP in all regimes for optimization
strategy_routing:
  bull: [trend_rider_pro]
  bear: [trend_rider_pro]
  chop: [trend_rider_pro]

strategies:
  trend_rider_pro:
    enabled: true
    hmm_gate:
      enabled: true
      reject_regimes: ["trend_down"]
      min_confidence: 0.6
    signal_timeframe: 5
    confluence_threshold: 85.0
    cooldown_bars: 12
    min_trend_alignment: 0.55
    time_window_start: "09:40"
    time_window_end: "14:30"
    pullback_threshold: 0.012
    stop_atr_mult: 1.5
    target_atr_mult: 2.5
    trail_min_profit_r: 0.5
    max_hold_minutes: 120
    activation:
      session: [opening]
      trend: [up, down]
      vol: [low, normal]
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.6

  # All other strategies disabled
  mean_reversion_pro:
    enabled: false
  flow_alpha:
    enabled: false
  orb_v2:
    enabled: false
  rsi_bounce:
    enabled: false
  momentum_fade:
    enabled: false
  pair_trading_v2:
    enabled: false
  vwap_reversion:
    enabled: false
  orb:
    enabled: false
  vwap_trend_rider:
    enabled: false
  index_mean_reversion:
    enabled: false
  flow_momentum:
    enabled: false
  gap_fill:
    enabled: false
  vix_spike_fade:
    enabled: false
  momentum_continuation:
    enabled: false
  fusion_v1:
    enabled: false
  pair_trading:
    enabled: false
  trend_pullback:
    enabled: false
  failed_breakout:
    enabled: false
  order_flow_imbalance:
    enabled: false
  intraday_momentum:
    enabled: false

# Risk — $100k account
risk:
  max_daily_loss: 3000.0
  max_risk_per_trade: 3000.0
  max_open_risk: 10000.0
  max_trades_per_day: 50
  max_open_positions: 8
  max_positions_per_strategy: 4
  max_notional_per_order: 90000.0
  max_notional_per_symbol: 90000.0
  time_in_force: "day"
  risk_mode: "normal"
  slippage_bps: 3.0
  commission_per_share: 0.003
  min_commission: 0.50

  advanced_exits:
    enabled: true
    trailing_stop:
      enabled: false
      min_profit_to_activate: 0.005
    partial_exits:
      enabled: false
    regime_aware_stops: true

  alpha_rank_multipliers:
    1: 1.5
    2: 1.25
    3: 1.1
    5: 1.0
    10: 0.75

# Backtest Realism
backtest:
  disable_flow_strategies: true
  partial_fill_mode: "full"
  partial_fill_pct: 1.0
  slippage_mode: "fixed"
  slippage_impact_mult: 5.0
  spread_mode: "fixed"
  daily_equity_reset: false
  rth_only: true
  force_flat_at_1600: true

# Scanner
scanner:
  enabled: true
  interval_minutes: 5
  max_watchlist_size: 20
  top_k_per_strategy: 5
  min_price: 5.0
  max_price: 500.0
  min_volume: 500000

# Universe — 15 top-liquidity names for fast iteration
universe:
  symbols:
    - SPY
    - QQQ
    - AAPL
    - NVDA
    - TSLA
    - AMD
    - AMZN
    - META
    - MSFT
    - GOOGL
    - JPM
    - GS
    - XOM
    - CVX
    - VXX
