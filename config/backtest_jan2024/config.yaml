# Backtest Configuration - All Strategies, All Regimes
#
# Purpose: Run every strategy regardless of regime to analyze which strategies
# work best in which market conditions. Includes VIX for risk regime detection.

# Global settings
database_url: "sqlite:///backtest_all_strategies.db"
timezone: "US/Eastern"
index_symbol: "SPY"
log_level: "INFO"
auto_eod_agent: false
position_mismatch_mode: "warn"

# Regime detection with VXX for volatility-based risk axis
regime:
  vol_symbol: "VXX"
  window: 60
  min_bars: 20
  vol_baseline_window: 120
  smooth_k: 5

# Strategy routing - ALL strategies in ALL regimes
strategy_routing:
  bull:
    - orb
    - trend_pullback
    - vwap_trend_rider
    - flow_momentum
    - vwap_reversion
    - failed_breakout
    - index_mean_reversion
    - gap_fill
    - momentum_continuation
  bear:
    - orb
    - trend_pullback
    - vwap_trend_rider
    - flow_momentum
    - vwap_reversion
    - failed_breakout
    - index_mean_reversion
    - gap_fill
    - momentum_continuation
  chop:
    - orb
    - trend_pullback
    - vwap_trend_rider
    - flow_momentum
    - vwap_reversion
    - failed_breakout
    - index_mean_reversion
    - gap_fill
    - momentum_continuation

# All strategies enabled
strategies:
  vwap_reversion:
    enabled: true
    band_sigma: 2.0
    sigma_band: 2.0
    confirmation: "rsi"
    rsi_len: 2
    rsi_oversold: 10
    rsi_overbought: 90
    risk_reward: 2.0
    time_window_start: "09:45"
    time_window_end: "15:45"
    max_hold_minutes: 60
  orb:
    enabled: true
    orb_minutes: 15
    risk_reward: 2.0
    stop_loss_pct: 0.005
    min_gap_pct: 0.0
    min_flow_zscore: 0.0
  index_mean_reversion:
    enabled: true
    symbols: ["SPY", "QQQ"]
    bb_len: 20
    bb_std: 2.0
    stop_pct: 0.005
  flow_momentum:
    enabled: true
    min_flow_zscore: 0.0  # Lowered to allow signals (flow is zeroed in backtest)
    vol_mult: 1.5
    risk_reward: 2.0
  gap_fill:
    enabled: true
    min_gap: 0.015
    max_gap: 0.1
    risk_reward: 2.0
    or_time_minutes: 15
    weak_trend_max_score: 1.0
  trend_pullback:
    enabled: true
    ema_fast: 20
    ema_slow: 50
    rsi_len: 2
    rsi_oversold: 10
    rsi_overbought: 90
    pullback_depth_pct: 0.0
    entry_confirmation: "rsi"
  failed_breakout:
    enabled: true
    risk_reward: 2.0
  vwap_trend_rider:
    enabled: true
    ema_fast: 20
    ema_slow: 50
    vol_mult: 1.2
    risk_reward: 2.0
    min_trend_score: 0.0  # Lowered to allow signals
  momentum_continuation:
    enabled: true
    breakout_lookback: 5
    vol_mult: 1.5
    close_position: 0.7
    risk_reward: 1.5
    ema_fast: 20
    ema_slow: 50
    max_trades_per_session: 3

# Risk settings (generous for backtest)
risk:
  max_daily_loss: 2000.0
  max_risk_per_trade: 100.0
  max_open_risk: 500.0
  max_trades_per_day: 100
  max_open_positions: 10
  max_positions_per_strategy: 5
  max_notional_per_order: 10000.0
  max_notional_per_symbol: 10000.0
  time_in_force: "day"
  risk_mode: "normal"
  commission_per_share: 0.0
  min_commission: 0.0
  slippage_bps: 5.0

# Backtest settings - realistic but not restrictive
backtest:
  disable_flow_strategies: false  # Test them all
  partial_fill_mode: "none"
  partial_fill_pct: 1.0
  partial_fill_rate: 0.1
  slippage_mode: "fixed"
  slippage_impact_mult: 5.0
  spread_mode: "fixed"

# Scanner disabled - use full universe
scanner:
  enabled: false
  interval_minutes: 5
  max_watchlist_size: 50
  top_k_per_strategy: 10
  min_price: 5.0
  max_price: 500.0
  min_volume: 100000

# Universe - use only downloaded symbols from static file
universe:
  symbols:
    - "SPY"  # Index for regime detection
  static_files:
    - "data/offline_bars_jan2024/offline_symbols.txt"
  dynamic:
    previous_day_top_volume:
      enabled: false  # Disabled for offline backtest
