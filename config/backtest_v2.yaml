# V2 Consolidated Strategy Backtest Config
# Tests the 5 V2 strategies with adaptive sizing, confluence gating,
# and structure-based trailing exits against 2024 data.

database_url: "sqlite:///backtest_v2.db"
timezone: "US/Eastern"
index_symbol: "SPY"
log_level: "INFO"
auto_eod_agent: false
initial_cash: 100000.0

# Multi-Axis Regime detection
regime:
  vol_symbol: "VXX"
  window: 60
  min_bars: 20
  vol_baseline_window: 120
  smooth_k: 5

# V2 Strategy Routing — regime-aware
strategy_routing:
  bull: [trend_rider_pro, flow_alpha, orb_v2, rsi_bounce, momentum_fade]
  bear: [trend_rider_pro, flow_alpha, orb_v2, rsi_bounce, momentum_fade]
  chop: [mean_reversion_pro, flow_alpha, rsi_bounce, momentum_fade]

# V2 Strategies — all new consolidated strategies
strategies:
  mean_reversion_pro:
    enabled: false       # Excluded from WFO (<5 trades/window), PF=0.72 on full backtest
    signal_timeframe: 5               # evaluate on 5m closes only
    confluence_threshold: 55.0
    cooldown_bars: 15
    max_hold_minutes: 30
    higher_tf_alignment: false
    activation:
      session: [opening, midday, power_hour]
      trend: [flat, up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5
  trend_rider_pro:
    enabled: true        # autoresearch trp: isolating for retuning with 5m + 15m gate
    signal_timeframe: 5               # evaluate pullbacks on 5m closes only
    confluence_threshold: 63.3       # WFO v3 mean (CV=0.17, stable)
    cooldown_bars: 4                    # autoresearch trp iter1: 4 * 5m = 20 min cooldown
    min_trend_alignment: 0.40        # autoresearch iter3: relaxed for more entries in confirmed trends
    time_window_start: "09:40"       # autoresearch iter27: avoid first 10min volatility
    pullback_threshold: 0.008        # autoresearch trp iter4: wider for 5m candle closes
    stop_atr_mult: 1.75             # autoresearch iter3: tighter stops for better R:R
    target_atr_mult: 4.5            # autoresearch trp iter7: wider target with 15m trend confirmation
    trail_min_profit_r: 0.75        # autoresearch iter2: let winners run before trailing
    max_hold_minutes: 240           # autoresearch iter11: near full-day hold
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.6
  flow_alpha:
    enabled: false
    signal_timeframe: 5               # evaluate on 5m closes only
    confluence_threshold: 50.0
    cooldown_bars: 25
    max_hold_minutes: 45
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.4
  orb_v2:
    enabled: false       # autoresearch trp: disabled to isolate TRP
    signal_timeframe: 1               # ORB needs 1m precision for timely breakout entry
    confluence_threshold: 60.0           # autoresearch orb iter7: raise quality bar
    cooldown_bars: 10                    # autoresearch orb iter10: breakout_fired already limits 1/day
    max_hold_minutes: 180              # autoresearch orb iter2: extend hold time
    vol_gate_mult: 1.53                # WFO v3 mean (CV=0.12, very stable)
    trail_min_profit_r: 0.96           # WFO v3 mean (CV=0.28, stable)
    activation:
      session: [opening, midday]  # Range builds during opening, breakouts fire in midday
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good]
      risk: [risk_on, neutral]
      min_confidence: 0.5
  rsi_bounce:
    enabled: false       # WFO v4 REJECT: 1/6 windows profitable, PF=0.42 on full backtest
    signal_timeframe: 5               # evaluate on 5m closes only
    confluence_threshold: 55.0
    cooldown_bars: 20
    max_hold_minutes: 45
    rsi_oversold: 20.0
    rsi_overbought: 80.0
    band_tolerance: 1.5
    target_atr_mult: 2.0
    activation:
      session: [opening, midday, power_hour]
      trend: [flat, up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5
  momentum_fade:
    enabled: false       # WFO v4 REJECT: 0 trades on 4-symbol universe, PF=0.73 on full
    signal_timeframe: 15              # exhaustion needs more candle development
    confluence_threshold: 55.0
    cooldown_bars: 20
    max_hold_minutes: 45
    vwap_threshold: 0.005
    volume_surge_mult: 1.5
    target_atr_mult: 2.0
    stop_atr_mult: 1.5
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down]
      vol: [normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5
  # pair_trading_v2 disabled for initial test — needs pair-specific data
  pair_trading_v2:
    enabled: false

  # V1 legacy strategies — explicitly disabled to prevent ConfigLoader deep-merge
  # from strategies.yaml activating them
  vwap_reversion:
    enabled: false
  orb:
    enabled: false
  vwap_trend_rider:
    enabled: false
  index_mean_reversion:
    enabled: false
  flow_momentum:
    enabled: false
  gap_fill:
    enabled: false
  vix_spike_fade:
    enabled: false
  momentum_continuation:
    enabled: false
  fusion_v1:
    enabled: false
  pair_trading:
    enabled: false
  trend_pullback:
    enabled: false
  failed_breakout:
    enabled: false
  order_flow_imbalance:
    enabled: false
  intraday_momentum:
    enabled: false

# Risk — sized for $100k account
risk:
  max_daily_loss: 3000.0          # 3% of account
  max_risk_per_trade: 1500.0      # 1.5% of account
  max_open_risk: 5000.0           # 5% total open risk
  max_trades_per_day: 50
  max_open_positions: 8
  max_positions_per_strategy: 4   # autoresearch iter18: more concurrent positions
  max_notional_per_order: 75000.0  # autoresearch iter33: push notional to 75k
  max_notional_per_symbol: 75000.0
  time_in_force: "day"
  risk_mode: "normal"
  slippage_bps: 3.0               # Realistic slippage for liquid names
  commission_per_share: 0.003      # ~IBKR tiered rate; Alpaca is 0 but models execution cost
  min_commission: 0.50             # Minimum per-order commission floor

  advanced_exits:
    enabled: true
    trailing_stop:
      enabled: true
      trail_pct: 0.02
      min_profit_to_activate: 0.005
    partial_exits:
      enabled: false              # V2 ExitManager handles partials
    regime_aware_stops: true

  alpha_rank_multipliers:
    1: 1.5
    2: 1.25
    3: 1.1
    5: 1.0
    10: 0.75

# Backtest Realism
backtest:
  disable_flow_strategies: true
  partial_fill_mode: "random"
  partial_fill_pct: 0.7              # Min fill ratio; actual = uniform(0.7, 1.0)
  slippage_mode: "fixed"
  slippage_impact_mult: 5.0
  spread_mode: "fixed"
  daily_equity_reset: false
  rth_only: true
  force_flat_at_1600: true

# Scanner
scanner:
  enabled: true
  interval_minutes: 5
  max_watchlist_size: 20
  top_k_per_strategy: 5
  min_price: 5.0
  max_price: 500.0
  min_volume: 500000

# Universe — only symbols we have data for in bars_2024
universe:
  symbols:
    - SPY
    - QQQ
    - AAPL
    - NVDA
    - TSLA
    - AMD
    - AMZN
    - META
    - MSFT
    - GOOGL
    - AVGO
    - NFLX
    - JPM
    - BAC
    - GS
    - CRM
    - XOM
    - CVX
    - MU
    - INTC
    - QCOM
    - PLTR
    - COIN
    - HOOD
    - SOFI
    - UBER
    - VXX
