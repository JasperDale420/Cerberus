# V2 Consolidated Strategy Backtest Config
# Tests the 5 V2 strategies with adaptive sizing, confluence gating,
# and structure-based trailing exits against 2024 data.

database_url: "sqlite:///backtest_v2.db"
timezone: "US/Eastern"
index_symbol: "SPY"
log_level: "INFO"
auto_eod_agent: false
initial_cash: 100000.0

# Multi-Axis Regime detection
regime:
  vol_symbol: "VXX"
  window: 60
  min_bars: 20
  vol_baseline_window: 120
  smooth_k: 5

# V2 Strategy Routing — regime-aware
strategy_routing:
  bull: [trend_rider_pro, flow_alpha, orb_v2]
  bear: [trend_rider_pro, flow_alpha, orb_v2]
  chop: [mean_reversion_pro, flow_alpha]

# V2 Strategies — all new consolidated strategies
strategies:
  mean_reversion_pro:
    enabled: true
    confluence_threshold: 45.0
    cooldown_bars: 30
    activation:
      session: [opening, midday, power_hour]
      trend: [flat, up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5
  trend_rider_pro:
    enabled: true
    confluence_threshold: 50.0
    cooldown_bars: 20
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.5
  flow_alpha:
    enabled: true
    confluence_threshold: 50.0
    cooldown_bars: 25
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.4
  orb_v2:
    enabled: true
    confluence_threshold: 45.0
    cooldown_bars: 40
    activation:
      session: [opening, midday]  # Range builds during opening, breakouts fire in midday
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good]
      risk: [risk_on, neutral]
      min_confidence: 0.5
  rsi_bounce:
    enabled: true
    confluence_threshold: 60.0
    cooldown_bars: 30
  momentum_fade:
    enabled: true
    confluence_threshold: 60.0
    cooldown_bars: 30
  # pair_trading_v2 disabled for initial test — needs pair-specific data
  pair_trading_v2:
    enabled: false

# Risk — sized for $100k account
risk:
  max_daily_loss: 3000.0          # 3% of account
  max_risk_per_trade: 1500.0      # 1.5% of account
  max_open_risk: 5000.0           # 5% total open risk
  max_trades_per_day: 10
  max_open_positions: 8
  max_positions_per_strategy: 2
  max_notional_per_order: 25000.0
  max_notional_per_symbol: 25000.0
  time_in_force: "day"
  risk_mode: "normal"
  slippage_bps: 3.0               # Realistic slippage for liquid names
  commission_per_share: 0.003      # ~IBKR tiered rate; Alpaca is 0 but models execution cost
  min_commission: 0.50             # Minimum per-order commission floor

  advanced_exits:
    enabled: true
    trailing_stop:
      enabled: true
      trail_pct: 0.02
      min_profit_to_activate: 0.005
    partial_exits:
      enabled: false              # V2 ExitManager handles partials
    regime_aware_stops: true

  alpha_rank_multipliers:
    1: 1.5
    2: 1.25
    3: 1.1
    5: 1.0
    10: 0.75

# Backtest Realism
backtest:
  disable_flow_strategies: false
  partial_fill_mode: "random"
  partial_fill_pct: 0.7              # Min fill ratio; actual = uniform(0.7, 1.0)
  slippage_mode: "fixed"
  slippage_impact_mult: 5.0
  spread_mode: "fixed"
  daily_equity_reset: false
  rth_only: true
  force_flat_at_1600: true

# Scanner
scanner:
  enabled: true
  interval_minutes: 5
  max_watchlist_size: 20
  top_k_per_strategy: 5
  min_price: 5.0
  max_price: 500.0
  min_volume: 500000

# Universe — only symbols we have data for in bars_2024
universe:
  symbols:
    - SPY
    - QQQ
    - AAPL
    - NVDA
    - TSLA
    - AMD
    - AMZN
    - META
    - MSFT
    - GOOGL
    - AVGO
    - NFLX
    - JPM
    - BAC
    - GS
    - CRM
    - XOM
    - CVX
    - MU
    - INTC
    - QCOM
    - PLTR
    - COIN
    - HOOD
    - SOFI
    - UBER
    - VXX
