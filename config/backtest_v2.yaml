# V2 Consolidated Strategy Backtest Config
# Tests the 5 V2 strategies with adaptive sizing, confluence gating,
# and structure-based trailing exits against 2024 data.

database_url: "sqlite:///backtest_v2.db"
timezone: "US/Eastern"
index_symbol: "SPY"
log_level: "INFO"
auto_eod_agent: false
initial_cash: 100000.0

# Multi-Axis Regime detection
regime:
  vol_symbol: "VXX"
  window: 60
  min_bars: 20
  vol_baseline_window: 120
  smooth_k: 5

# V2 Strategy Routing — regime-aware
strategy_routing:
  bull: [trend_rider_pro, flow_alpha, orb_v2, rsi_bounce, momentum_fade, regime_adaptive]
  bear: [trend_rider_pro, flow_alpha, orb_v2, rsi_bounce, momentum_fade, regime_adaptive]
  chop: [mean_reversion_pro, flow_alpha, rsi_bounce, momentum_fade, pair_trading_v2, regime_adaptive]

# V2 Strategies — all new consolidated strategies
strategies:
  mean_reversion_pro:
    enabled: false       # autoresearch iter10: disabled to isolate TRP
    hmm_gate:
      enabled: true
      reject_regimes: ["stress_up"]
      min_confidence: 0.6
    signal_timeframe: 5               # evaluate on 5m closes only
    confluence_threshold: 45.0        # WFO quant_v2_hmm median (CV=0.16, stable)
    cooldown_bars: 6                  # 30 min at 5m
    max_hold_minutes: 60              # WFO quant_v2_hmm median (CV=0.48)
    higher_tf_alignment: false
    vwap_dist_threshold: 0.006        # WFO quant_v2_hmm median (CV=0.30)
    bb_pos_threshold: 0.40            # WFO quant_v2_hmm median (CV=0.50)
    vpin_threshold: 0.95              # disable VPIN gate
    stop_atr_mult: 2.0                # WFO quant_v2_hmm median (CV=0.22, most stable)
    min_bars: 20                      # moderate warmup
    activation:
      session: [opening, midday, power_hour]
      trend: [flat, up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5
  trend_rider_pro:
    enabled: true        # ACTIVE: best strategy
    hmm_gate:
      enabled: true
      reject_regimes: ["trend_down"]
      min_confidence: 0.6
    signal_timeframe: 5               # evaluate pullbacks on 5m closes only
    confluence_threshold: 65.0        # autoresearch iter32: slight relaxation with hard gates
    cooldown_bars: 4                    # autoresearch trp iter1: 4 * 5m = 20 min cooldown
    min_trend_alignment: 0.30        # autoresearch trp iter9: 15m hard gate handles confirmation
    time_window_start: "09:40"       # autoresearch iter27: avoid first 10min volatility
    time_window_end: "14:30"         # autoresearch iter22: stop entering before EOD
    pullback_threshold: 0.008        # autoresearch trp iter4: wider for 5m candle closes
    stop_atr_mult: 2.5              # autoresearch iter23: wider stop for noise survival
    target_atr_mult: 4.0            # autoresearch iter37: test 4.0 with hardened gates
    trail_min_profit_r: 0.75        # autoresearch iter31: trail from higher profit
    max_hold_minutes: 120           # autoresearch 2025 iter6: shorter hold reduces mean reversion
    activation:
      session: [opening, midday]          # autoresearch iter17: drop power_hour
      trend: [up, down]
      vol: [low, normal]               # autoresearch iter18: avoid high vol whipsaws
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.6
  flow_alpha:
    enabled: false
    signal_timeframe: 5               # evaluate on 5m closes only
    confluence_threshold: 50.0
    cooldown_bars: 25
    max_hold_minutes: 45
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.4
  orb_v2:
    enabled: false       # autoresearch iter10: disabled to isolate TRP
    hmm_gate:
      enabled: true
      reject_regimes: ["stress_up"]
      min_confidence: 0.6
    signal_timeframe: 1               # ORB needs 1m precision for timely breakout entry
    confluence_threshold: 60.0           # autoresearch orb iter7: raise quality bar
    cooldown_bars: 10                    # autoresearch orb iter10: breakout_fired already limits 1/day
    max_hold_minutes: 180              # autoresearch orb iter2: extend hold time
    vol_gate_mult: 1.53                # WFO v3 mean (CV=0.12, very stable)
    trail_min_profit_r: 0.96           # WFO v3 mean (CV=0.28, stable)
    activation:
      session: [opening, midday]  # Range builds during opening, breakouts fire in midday
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good]
      risk: [risk_on, neutral]
      min_confidence: 0.5
  rsi_bounce:
    enabled: false       # autoresearch iter10: disabled to isolate TRP
    hmm_gate:
      enabled: true
      reject_regimes: ["stress_up"]
      min_confidence: 0.6
    signal_timeframe: 5               # evaluate on 5m closes only
    confluence_threshold: 55.0
    cooldown_bars: 20
    max_hold_minutes: 45
    rsi_oversold: 20.0
    rsi_overbought: 80.0
    band_tolerance: 1.5
    target_atr_mult: 2.0
    activation:
      session: [opening, midday, power_hour]
      trend: [flat, up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5
  momentum_fade:
    enabled: false       # autoresearch iter10: disabled to isolate TRP
    hmm_gate:
      enabled: true
      reject_regimes: ["trend_up", "trend_down"]
      min_confidence: 0.6
    signal_timeframe: 5               # autoresearch mf: evaluate on 5m closes
    confluence_threshold: 75.0        # autoresearch mf iter2: very high bar
    cooldown_bars: 4                  # 20 min at 5m
    max_hold_minutes: 90
    vwap_threshold: 0.005
    volume_surge_mult: 1.5
    target_atr_mult: 3.0             # autoresearch mf: wider target for mean-reversion
    stop_atr_mult: 1.25              # autoresearch mf: tight stop
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down]
      vol: [normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5
  pair_trading_v2:
    enabled: true
    allow_overnight: true
    max_hold_days: 15               # max hold period in trading days
    pairs:
      # Tech / Semis
      - {leg_a: "AAPL", leg_b: "MSFT"}         # Mega-cap tech
      - {leg_a: "NVDA", leg_b: "AMD"}           # GPU rivals
      - {leg_a: "AVGO", leg_b: "QCOM"}          # Chip designers
      - {leg_a: "INTC", leg_b: "AMD"}           # CPU rivals
      - {leg_a: "MU", leg_b: "INTC"}            # Memory / CPU
      - {leg_a: "GOOGL", leg_b: "META"}         # Digital ads
      - {leg_a: "AMZN", leg_b: "MSFT"}          # Cloud
      - {leg_a: "CRM", leg_b: "ORCL"}           # Enterprise SaaS
      - {leg_a: "NFLX", leg_b: "GOOGL"}         # Streaming / content
      - {leg_a: "MRVL", leg_b: "AVGO"}          # Semis (Marvell/Broadcom)
      - {leg_a: "DDOG", leg_b: "NET"}           # Cloud infrastructure
      - {leg_a: "SNOW", leg_b: "DDOG"}          # Cloud data platforms
      # Financials
      - {leg_a: "GS", leg_b: "MS"}              # Investment banks
      - {leg_a: "JPM", leg_b: "BAC"}            # Big banks
      - {leg_a: "JPM", leg_b: "GS"}             # Bank cross
      - {leg_a: "BAC", leg_b: "MS"}             # Bank cross
      - {leg_a: "C", leg_b: "BAC"}              # Big banks (Citi/BoA)
      # Energy
      - {leg_a: "XOM", leg_b: "CVX"}            # Oil majors
      - {leg_a: "OXY", leg_b: "XOM"}            # Oil producers
      - {leg_a: "HAL", leg_b: "SLB"}            # Oilfield services
      # Transport
      - {leg_a: "DAL", leg_b: "AAL"}            # Airlines
      - {leg_a: "UAL", leg_b: "DAL"}            # Airlines
      - {leg_a: "UBER", leg_b: "LYFT"}          # Rideshare
      - {leg_a: "RCL", leg_b: "CCL"}            # Cruise lines
      # Healthcare / Pharma
      - {leg_a: "JNJ", leg_b: "PFE"}            # Big pharma
      - {leg_a: "MRK", leg_b: "ABBV"}           # Pharma
      - {leg_a: "UNH", leg_b: "JNJ"}            # Healthcare
      # Retail
      - {leg_a: "HD", leg_b: "WMT"}             # Retail giants
      - {leg_a: "COST", leg_b: "TGT"}           # Discount retail
      # Crypto / Fintech
      - {leg_a: "COIN", leg_b: "HOOD"}          # Retail trading platforms
      - {leg_a: "MARA", leg_b: "RIOT"}          # Crypto miners
      # EV
      - {leg_a: "NIO", leg_b: "RIVN"}           # EV startups
      # Auto
      - {leg_a: "F", leg_b: "GM"}               # Auto legacy
      # Quantum Computing
      - {leg_a: "IONQ", leg_b: "RGTI"}          # Quantum computing
    entry_z_threshold: 1.5
    stop_z_threshold: 3.5
    spread_lookback: 90              # trading days (~4.5 months)
    min_bars: 30                     # ~6 weeks warmup
    confluence_threshold: 40.0
    min_correlation: 0.4
    activation:
      trend: [flat, up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.4

  regime_trend_up:
    enabled: true
    min_bars: 30
    pullback_pct: 0.02        # 2% window around EMA20 — buy the dip
    rsi_min: 30.0
    rsi_max: 70.0
    stop_atr_mult: 1.5
    target_rr: 2.5
    time_window_start: "09:35"
    time_window_end: "15:45"
    cooldown_bars: 5
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral, risk_off]
      min_confidence: 0.0

  regime_adaptive:
    enabled: true
    rsi_long_entry: 45.0
    rsi_short_entry: 60.0
    stop_atr_mult: 1.5
    target_atr_mult: 3.0
    min_bars: 20
    cooldown_bars: 5
    activation:
      session: [premarket, opening, midday, power_hour, close]
      trend: [up, down, flat]
      vol: [low, normal, high, shock]
      liquidity: [good, thin, stressed]
      risk: [risk_on, neutral, risk_off]
      min_confidence: 0.0

  autoresearch_strategy:
    enabled: true
    stop_atr_mult: 1.5
    target_atr_mult: 3.0
    min_bars: 30
    cooldown_bars: 5
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral, risk_off]
      min_confidence: 0.0

  # V1 legacy strategies — explicitly disabled to prevent ConfigLoader deep-merge
  # from strategies.yaml activating them
  vwap_reversion:
    enabled: false
  orb:
    enabled: false
  vwap_trend_rider:
    enabled: false
  index_mean_reversion:
    enabled: false
  flow_momentum:
    enabled: false
  gap_fill:
    enabled: false
  vix_spike_fade:
    enabled: false
  momentum_continuation:
    enabled: false
  fusion_v1:
    enabled: false
  pair_trading:
    enabled: false
  trend_pullback:
    enabled: false
  failed_breakout:
    enabled: false
  order_flow_imbalance:
    enabled: false
  intraday_momentum:
    enabled: false

# Risk — sized for $100k account
risk:
  max_daily_loss: 3000.0          # 3% of account
  max_risk_per_trade: 3000.0      # 3% risk per trade
  max_open_risk: 10000.0          # 10% total open risk
  max_trades_per_day: 50
  max_open_positions: 8
  max_positions_per_strategy: 4
  max_notional_per_order: 90000.0
  max_notional_per_symbol: 90000.0
  # max_notional_pct now defaults to 0.50 (50%) in code — caps qty instead of rejecting
  time_in_force: "day"
  risk_mode: "normal"
  slippage_bps: 3.0               # Realistic slippage for liquid names
  commission_per_share: 0.003      # ~IBKR tiered rate; Alpaca is 0 but models execution cost
  min_commission: 0.50             # Minimum per-order commission floor

  advanced_exits:
    enabled: true
    trailing_stop:
      enabled: true
      trail_pct: 0.02
      min_profit_to_activate: 0.005
    partial_exits:
      enabled: false              # V2 ExitManager handles partials
    regime_aware_stops: true

  alpha_rank_multipliers:
    1: 1.5
    2: 1.25
    3: 1.1
    5: 1.0
    10: 0.75

# Backtest Realism
backtest:
  disable_flow_strategies: true
  partial_fill_mode: "random"
  partial_fill_pct: 0.7              # Min fill ratio; actual = uniform(0.7, 1.0)
  slippage_mode: "fixed"
  slippage_impact_mult: 5.0
  spread_mode: "fixed"
  daily_equity_reset: false
  rth_only: true
  force_flat_at_1600: true

# Scanner
scanner:
  enabled: true
  interval_minutes: 5
  max_watchlist_size: 20
  top_k_per_strategy: 5
  min_price: 5.0
  max_price: 500.0
  min_volume: 500000

