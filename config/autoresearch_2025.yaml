# Autoresearch 2025 — Beat S&P 500
# Full-year 2025 backtest config, all V2 strategies enabled as baseline
# Metric: total_return_pct > SPY benchmark_return_pct

database_url: "sqlite:///backtest_autoresearch_2025.db"
timezone: "US/Eastern"
index_symbol: "SPY"
log_level: "WARNING"
auto_eod_agent: false
initial_cash: 100000.0

# Multi-Axis Regime detection
regime:
  vol_symbol: "VXX"
  window: 60
  min_bars: 20
  vol_baseline_window: 120
  smooth_k: 5

# Route all V2 strategies in all regimes
strategy_routing:
  bull: [daily_momentum, trend_rider_pro, mean_reversion_pro, orb_v2, rsi_bounce, momentum_fade]
  bear: [trend_rider_pro, mean_reversion_pro, orb_v2, rsi_bounce, momentum_fade]
  chop: [daily_momentum, mean_reversion_pro, rsi_bounce, momentum_fade]

strategies:
  daily_momentum:
    enabled: true               # iter9: re-enable on daily bars
    allow_overnight: true
    max_hold_days: 15            # iter9: hold longer on daily timeframe
    signal_timeframe: 1          # iter9: every bar is a daily bar now
    ema_fast_period: 10          # iter5: faster EMA for quicker trend detection
    ema_slow_period: 30          # iter5: shorter slow EMA, less warmup needed
    pullback_pct: 0.04           # iter5: 4% pullback zone (was 1.5%) — catch more entries
    stop_atr_mult: 1.5           # iter11: tighter stop (2.0→1.5) — cut losses
    target_atr_mult: 6.0        # iter11: wider target (5.0→6.0) — bigger winners
    min_bars: 25                 # iter9: further reduced for daily bars
    cooldown_bars: 3             # iter9: 3-day cooldown on daily bars
    confluence_threshold: 30.0
    long_only: true
    vol_avg_mult: 0.5
    # iter10: no activation policy — daily bars don't have intraday session/regime data

  mean_reversion_pro:
    enabled: false              # iter2: disable (-$151)
    hmm_gate:
      enabled: true
      reject_regimes: ["stress_up"]
      min_confidence: 0.6
    signal_timeframe: 5
    confluence_threshold: 45.0
    cooldown_bars: 6
    max_hold_minutes: 60
    higher_tf_alignment: false
    vwap_dist_threshold: 0.006
    bb_pos_threshold: 0.40
    vpin_threshold: 0.95
    stop_atr_mult: 2.0
    min_bars: 20
    activation:
      session: [opening, midday, power_hour]
      trend: [flat, up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5

  trend_rider_pro:
    enabled: false              # iter1: disable (-$10K)
    hmm_gate:
      enabled: true
      reject_regimes: ["trend_down"]
      min_confidence: 0.6
    signal_timeframe: 5
    confluence_threshold: 65.0
    cooldown_bars: 4
    min_trend_alignment: 0.30
    time_window_start: "09:40"
    time_window_end: "14:30"
    pullback_threshold: 0.008
    stop_atr_mult: 2.5
    target_atr_mult: 4.0
    trail_min_profit_r: 0.75
    max_hold_minutes: 120
    activation:
      session: [opening, midday]
      trend: [up, down]
      vol: [low, normal]
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.6

  flow_alpha:
    enabled: false
    signal_timeframe: 5
    confluence_threshold: 50.0
    cooldown_bars: 25
    max_hold_minutes: 45
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [risk_on, neutral]
      min_confidence: 0.4

  orb_v2:
    enabled: false              # iter2: -$1177 on 16 trades, disable
    hmm_gate:
      enabled: true
      reject_regimes: ["stress_up"]
      min_confidence: 0.6
    signal_timeframe: 1
    confluence_threshold: 60.0
    cooldown_bars: 10
    max_hold_minutes: 180
    vol_gate_mult: 1.53
    trail_min_profit_r: 0.96
    activation:
      session: [opening, midday]
      trend: [up, down, flat]
      vol: [low, normal, high]
      liquidity: [good]
      risk: [risk_on, neutral]
      min_confidence: 0.5

  rsi_bounce:
    enabled: true
    hmm_gate:
      enabled: true
      reject_regimes: ["stress_up"]
      min_confidence: 0.6
    signal_timeframe: 5
    confluence_threshold: 55.0
    cooldown_bars: 20
    max_hold_minutes: 45
    rsi_oversold: 20.0
    rsi_overbought: 80.0
    band_tolerance: 1.5
    target_atr_mult: 2.0
    activation:
      session: [opening, midday, power_hour]
      trend: [flat, up, down]
      vol: [low, normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5

  momentum_fade:
    enabled: true
    hmm_gate:
      enabled: true
      reject_regimes: ["trend_up", "trend_down"]
      min_confidence: 0.6
    signal_timeframe: 5
    confluence_threshold: 75.0
    cooldown_bars: 4
    max_hold_minutes: 90
    vwap_threshold: 0.005
    volume_surge_mult: 1.5
    target_atr_mult: 3.0
    stop_atr_mult: 1.25
    activation:
      session: [opening, midday, power_hour]
      trend: [up, down]
      vol: [normal, high]
      liquidity: [good, thin]
      risk: [neutral, risk_off]
      min_confidence: 0.5

  pair_trading_v2:
    enabled: true
    allow_overnight: true
    max_hold_days: 5
    pairs:
      - {leg_a: "XOM", leg_b: "CVX"}
      - {leg_a: "JPM", leg_b: "GS"}
      - {leg_a: "GOOGL", leg_b: "META"}
      - {leg_a: "AAPL", leg_b: "MSFT"}
    entry_z_threshold: 1.5
    stop_z_threshold: 5.0
    spread_lookback: 70
    min_bars: 30
    confluence_threshold: 45.0
    min_correlation: 0.55
    # iter10: no activation policy for daily bars

  # V1 legacy — disabled
  vwap_reversion:
    enabled: false
  orb:
    enabled: false
  vwap_trend_rider:
    enabled: false
  index_mean_reversion:
    enabled: false
  flow_momentum:
    enabled: false
  gap_fill:
    enabled: false
  vix_spike_fade:
    enabled: false
  momentum_continuation:
    enabled: false
  fusion_v1:
    enabled: false
  pair_trading:
    enabled: false
  trend_pullback:
    enabled: false
  failed_breakout:
    enabled: false
  order_flow_imbalance:
    enabled: false
  intraday_momentum:
    enabled: false

# Risk — $100k account
risk:
  max_daily_loss: 3000.0
  max_risk_per_trade: 3000.0
  max_open_risk: 10000.0
  max_trades_per_day: 80
  max_open_positions: 12
  max_positions_per_strategy: 4
  max_notional_per_order: 90000.0
  max_notional_per_symbol: 90000.0
  time_in_force: "day"
  risk_mode: "normal"
  slippage_bps: 3.0
  commission_per_share: 0.003
  min_commission: 0.50

  advanced_exits:
    enabled: true
    trailing_stop:
      enabled: true
      trail_pct: 0.02
      min_profit_to_activate: 0.005
    partial_exits:
      enabled: false
    regime_aware_stops: true

  alpha_rank_multipliers:
    1: 1.5
    2: 1.25
    3: 1.1
    5: 1.0
    10: 0.75

# Backtest Realism
backtest:
  bar_resolution_minutes: daily          # iter9: daily bars for swing strategies
  disable_flow_strategies: true
  partial_fill_mode: "full"       # iter8: deterministic fills for reliable metric
  partial_fill_pct: 1.0
  slippage_mode: "fixed"
  slippage_impact_mult: 5.0
  spread_mode: "fixed"
  daily_equity_reset: false
  rth_only: true
  force_flat_at_1600: true

# Scanner
scanner:
  enabled: true
  interval_minutes: 5
  max_watchlist_size: 20
  top_k_per_strategy: 5
  min_price: 5.0
  max_price: 500.0
  min_volume: 500000

# Universe — top 15 liquid names for fast iteration (expand after finding edge)
universe:
  symbols:
    - SPY
    - QQQ
    - AAPL
    - NVDA
    - TSLA
    - AMD
    - AMZN
    - META
    - MSFT
    - GOOGL
    - JPM
    - GS
    - XOM
    - CVX
    - VXX
