# Empire-wide Ruff configuration
# Individual repos extend this via: extend = "../ruff-base.toml" in their [tool.ruff] section
# Repos may override specific settings (e.g., target-version, ignore rules) in their pyproject.toml

line-length = 120
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",   # Function call in argument defaults (common in FastAPI Depends)
    "B904",   # Exception chaining (requires code refactor)
    "E402",   # Module level import not at top of file
    "E501",   # Line too long (handled by formatter)
    "SIM102", # Nested if simplification (can reduce readability)
    "SIM108", # Ternary operator suggestion (readability preference)
]

[lint.isort]
known-first-party = []

[format]
quote-style = "double"
indent-style = "space"
